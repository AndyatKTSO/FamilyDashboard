name: Familienkalender aktualisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install icalendar requests

      - name: Kalender aktualisieren
        run: python update_calendar.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet calendar.json; then
            echo "Keine Änderungen im Kalender."
          else
            git add calendar.json
            git commit -m "Kalender automatisch aktualisiert"
            git push
          fi

name: Familienkalender aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install icalendar python-dateutil
      - name: Kalender laden
        run: python update_calendar.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "Kalender aktualisieren"
          git push

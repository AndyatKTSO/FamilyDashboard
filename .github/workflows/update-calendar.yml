name: Update calendar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: pip install requests icalendar

      - name: Kalender aktualisieren
        run: python update_calendar.py

      - name: calendar.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen in calendar.json."
          else
            git commit -m "Kalender automatisch aktualisiert"
            git push
          fi

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f5">
<meta name="robots" content="noindex,nofollow">
<title>Family Dashboard – Nachricht bearbeiten</title>
<style>
:root{--text:#1e2d3a;--muted:#6b7b88;--line:#d7e3ea;--blue:#5f8faa;--blue-dark:#49788f;--danger:#b42318;--ok:#2f7d32}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#e7f1f6 0%,#f3f6f8 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:20px}.wrap{max-width:760px;margin:0 auto}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(30,41,59,.07);overflow:hidden}
.head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.content{padding:22px}label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}
.date-badge{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;background:#f4f8fa;border:1px solid var(--line);font-size:14px;font-weight:700;margin-bottom:20px}
textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px 15px;font:inherit;font-size:18px;line-height:1.45;color:var(--text);background:#fbfdfe;outline:none}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(95,143,170,.12)}
.charcount{margin-top:6px;text-align:right;color:var(--muted);font-size:12px}
.preview-wrap{margin-top:22px}.preview{min-height:180px;border-radius:16px;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}
.preview-time{font-size:44px;line-height:1;font-weight:650}.preview-date{margin-top:8px;color:#8f8f8f;font-size:13px}
.preview-message{margin-top:26px;font-size:24px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;max-width:620px}.preview-message:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,a.button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#eef3f6;color:var(--text)}.danger{background:#fff1f0;color:var(--danger)}
.status{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px}
.status.show{display:block}.status.ok{background:#eff8ef;color:var(--ok)}.status.error{background:#fff1f0;color:var(--danger)}.status.info{background:#f4f8fa;color:var(--muted)}
@media(max-width:600px){body{padding:10px}.head,.content{padding:17px}.preview-time{font-size:38px}.preview-message{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>Nachricht für zuhause</h1>
      <div class="subtitle">Die Nachricht wird heute angezeigt und verschwindet um Mitternacht automatisch.</div>
    </div>
    <div class="content">
      <label>Gültig für</label>
      <div id="todayBadge" class="date-badge">Heute</div>

      <label for="messageInput">Nachricht</label>
      <textarea id="messageInput" maxlength="500" placeholder="z. B. Bin um ca. 18:30 Uhr wieder zuhause."></textarea>
      <div id="charCount" class="charcount">0 / 500</div>

      <div class="preview-wrap">
        <label>Vorschau</label>
        <div class="preview">
          <div id="previewTime" class="preview-time">--:--</div>
          <div id="previewDate" class="preview-date"></div>
          <div id="previewMessage" class="preview-message"></div>
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="primary">Für heute speichern</button>
        <button id="clearBtn" class="danger">Nachricht löschen</button>
        <a class="button secondary" href="./screensaver.html" target="_blank">Bildschirmschoner öffnen</a>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>
</div>

<script>
const API_URL='/api/message';

function localDateKey(date=new Date()){
  return new Intl.DateTimeFormat('sv-SE',{
    timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'
  }).format(date);
}
function formatDate(date=new Date()){
  return new Intl.DateTimeFormat('de-CH',{
    timeZone:'Europe/Zurich',weekday:'long',day:'2-digit',month:'long',year:'numeric'
  }).format(date);
}
function formatTime(date=new Date()){
  return new Intl.DateTimeFormat('de-CH',{
    timeZone:'Europe/Zurich',hour:'2-digit',minute:'2-digit',hour12:false
  }).format(date);
}
function setStatus(type,text){
  const el=document.getElementById('status');
  el.className='status show '+type;
  el.textContent=text;
}
function updatePreviewClock(){
  const now=new Date();
  document.getElementById('previewTime').textContent=formatTime(now);
  document.getElementById('previewDate').textContent=formatDate(now);
}
function updatePreviewMessage(){
  const value=document.getElementById('messageInput').value;
  document.getElementById('previewMessage').textContent=value.trim();
  document.getElementById('charCount').textContent=`${value.length} / 500`;
}
async function sendMessage(date,message){
  const r=await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({date,message})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
async function saveMessage(){
  const message=document.getElementById('messageInput').value.trim();
  if(!message){
    setStatus('error','Bitte zuerst eine Nachricht eingeben.');
    return;
  }
  setStatus('info','Nachricht wird gespeichert …');
  try{
    await sendMessage(localDateKey(),message);
    setStatus('ok','Nachricht wurde für heute gespeichert.');
  }catch(e){
    setStatus('error',e.message);
  }
}
async function clearMessage(){
  setStatus('info','Nachricht wird gelöscht …');
  try{
    await sendMessage('','');
    document.getElementById('messageInput').value='';
    updatePreviewMessage();
    setStatus('ok','Nachricht wurde gelöscht.');
  }catch(e){
    setStatus('error',e.message);
  }
}
async function loadCurrentMessage(){
  try{
    const r=await fetch('./message.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const d=await r.json();
    if(String(d.date||'')===localDateKey() && typeof d.message==='string'){
      document.getElementById('messageInput').value=d.message;
      updatePreviewMessage();
    }
  }catch{}
}

document.getElementById('todayBadge').textContent=formatDate(new Date());
document.getElementById('messageInput').addEventListener('input',updatePreviewMessage);
document.getElementById('saveBtn').addEventListener('click',saveMessage);
document.getElementById('clearBtn').addEventListener('click',clearMessage);

updatePreviewClock();
updatePreviewMessage();
loadCurrentMessage();
setInterval(updatePreviewClock,1000);
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f5">
<title>Family Dashboard</title>
<style>
:root{
  --bg:#eaf2f7;
  --card:#ffffff;
  --text:#1f2d3a;
  --muted:#687784;
  --line:#dbe5ec;
  --blue:#1677c8;
  --blue-soft:#e8f4fc;
  --sky:#dff2fb;
  --sky-deep:#cfeaf8;
  --sun:#fff5d8;
  --light:#f7fafc;
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  linear-gradient(145deg,#e3f1f8 0%,#edf4f7 45%,#f3f5f7 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:18px}
@media (orientation: landscape) and (min-width:700px){
  .oev-frame-wrap{height:430px;overflow:hidden}

  body{padding:10px 8px 8px}
  .wrap{max-width:none}
  
  
  
  
  .card-inner,.oev-head{padding:12px}
  .card h2{font-size:20px}
  .subtitle{font-size:.82rem}
  .weather-top{margin:12px 0 10px}
  .current-temp{font-size:58px}
  .current-summary{font-size:.92rem}
  .current-extra{font-size:.82rem}
  .weather-icon{font-size:48px}
  .timeline{min-width:0;grid-auto-columns:1fr}
  .hour{padding:8px 6px}
  .hour-time{font-size:.78rem}
  .hour-icon{font-size:22px;margin:5px 0}
  .hour-temp{font-size:.95rem}
  .hour-rain{font-size:.72rem;margin-top:4px}
  .hour-mm{font-size:.68rem}
  .metrics{gap:6px;margin-top:10px}
  .metric{padding:9px}
  .metric-label{font-size:.68rem}
  .metric-value{font-size:.95rem}
  .section-note{font-size:.7rem;margin-top:8px}
}
.wrap{max-width:1600px;margin:0 auto}




.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(30,41,59,.06);overflow:hidden}
.grid > .card{
  background:linear-gradient(180deg,#fafdff 0%,#edf7fc 100%);
  border-color:#cfe3ef;
}
.card-inner{padding:22px}
.card h2{font-size:clamp(21px,2.2vw,30px);margin:0 0 4px;letter-spacing:-.03em}
.grid > .card h2::after{
  content:"";
  display:block;
  width:42px;
  height:4px;
  border-radius:999px;
  background:var(--blue);
  margin-top:8px;
}
.subtitle{color:var(--muted);font-size:.95rem}
.weather-top{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  margin:18px 0 14px;
  padding:14px 16px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--sky) 0%,#f6fbfe 100%);
}
.current-temp{font-size:clamp(58px,8vw,96px);font-weight:730;letter-spacing:-.065em;line-height:.9}
.current-summary{font-size:1.05rem;margin-top:8px}
.current-extra{color:var(--muted);margin-top:6px}
.weather-icon{font-size:72px}
.timeline-wrap{overflow-x:auto;padding-bottom:4px}
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);min-width:820px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hour{
  padding:14px 10px;text-align:center;border-right:1px solid #d7e6ef;
  background:rgba(255,255,255,.72)
}
.hour:last-child{border-right:0}
.hour.now{background:#dff1fc;box-shadow:inset 0 3px 0 var(--blue)}
.hour-time{font-weight:800;font-size:.92rem}
.hour-icon{font-size:29px;margin:9px 0}
.hour-temp{font-weight:800;font-size:1.12rem}
.hour-rain{font-size:.8rem;color:#086faf;font-weight:800;margin-top:7px}
.hour-mm{font-size:.75rem;color:var(--muted);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.metric{
  background:rgba(255,255,255,.78);
  border:1px solid #d8e8f1;
  border-radius:15px;
  padding:13px
}
.metric:nth-child(1){background:#e6f4fd}
.metric:nth-child(2){background:#edf7fb}
.metric:nth-child(3){background:#fff9e9}
.metric-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.metric-value{font-size:1.1rem;font-weight:750;margin-top:4px}
.section-note{font-size:.8rem;color:var(--muted);margin-top:12px}
.oev-head{padding:22px 22px 12px}
.oev-frame-wrap{height:660px;background:#fff;overflow:hidden}
.oev-frame{width:100%;height:100%;border:0;display:block;background:#fff}

.status{color:var(--muted);font-size:.9rem;margin-top:12px}
.error{color:#b42318}

@media (orientation: landscape) and (min-width:700px){
  .grid{
    grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);
    gap:10px;
    align-items:stretch;
    min-height:calc(100vh - 16px);
  }
  .card{height:auto}
  .right{height:auto}
  .oev-frame-wrap{height:calc(100% - 58px);min-height:0}
}
@media (orientation: portrait), (max-width:699px){
  .grid{grid-template-columns:1fr}
  .oev-frame-wrap{height:560px}
}
@media(max-width:650px){
  body{padding:10px}
  .card-inner,.oev-head{padding:16px}
  .metrics{grid-template-columns:1fr}
  .oev-frame-wrap{height:520px}
}
</style>
</head>
<body>
<div class="wrap">
<main class="grid">
  <section class="card">
    <div class="card-inner">
      <h2>Wetter Starrkirch-Wil</h2>
      <div class="subtitle">Tagesverlauf · 2-Stunden-Prognose</div>

      <div class="weather-top">
        <div>
          <div id="currentTemp" class="current-temp">–°</div>
          <div id="currentSummary" class="current-summary">Wetter wird geladen …</div>
          <div id="currentExtra" class="current-extra"></div>
        </div>
        <div id="currentIcon" class="weather-icon">⛅</div>
      </div>

      <div class="timeline-wrap">
        <div id="timeline" class="timeline"></div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Max. Regenwahrscheinlichkeit ab jetzt</div>
          <div id="maxRain" class="metric-value">–</div>
        </div>
        <div class="metric">
          <div class="metric-label">Niederschlag ab jetzt</div>
          <div id="rainSum" class="metric-value">–</div>
        </div>
        <div class="metric">
          <div class="metric-label">Temperatur ab jetzt</div>
          <div id="tempRange" class="metric-value">–</div>
        </div>
      </div>

      <div id="weatherStatus" class="section-note">Automatische Aktualisierung alle 10 Minuten.</div>
    </div>
  </section>

  <section class="card">
    <div class="oev-head">
      <h2>Starrkirch, Rütli → Olten</h2>
      <div class="subtitle">Linie 502 · nächste Abfahrten</div>
    </div>
    <div class="oev-frame-wrap">
      <iframe
        class="oev-frame"
        src="https://freemonitor.oevplus.ch/monitor?title=%22Starrkirch%2C+R%C3%BCtli%22&showPlatform=false&stations=%5B%7B%22stationId%22%3A%228590434%22%2C%22lines%22%3A%5B%7B%22lineId%22%3A%22502%22%2C%22directionIds%22%3A%5B%22outbound%22%5D%7D%2C%7B%22lineId%22%3A%2285%3A793%3A502%22%2C%22directionIds%22%3A%5B%222%22%5D%7D%5D%7D%5D"
        title="Abfahrten Starrkirch Rütli Richtung Olten"
        loading="eager">
      </iframe>
    </div>
  </section>
</main>

</div>

<script>
const LAT = 47.3486;
const LON = 7.9264;

function weatherInfo(code){
  if(code===0) return ['Sonnig','☀️'];
  if(code===1) return ['Meist sonnig','🌤️'];
  if(code===2) return ['Teilweise bewölkt','⛅'];
  if(code===3) return ['Bewölkt','☁️'];
  if([45,48].includes(code)) return ['Nebel','🌫️'];
  if([51,53,55,56,57].includes(code)) return ['Nieselregen','🌦️'];
  if([61,63,65,66,67].includes(code)) return ['Regen','🌧️'];
  if([71,73,75,77].includes(code)) return ['Schnee','🌨️'];
  if([80,81,82].includes(code)) return ['Regenschauer','🌦️'];
  if([85,86].includes(code)) return ['Schneeschauer','🌨️'];
  if([95,96,99].includes(code)) return ['Gewitter','⛈️'];
  return ['Wetter','⛅'];
}

async function loadWeather(){
  const status=document.getElementById('weatherStatus');
  try{
    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m`+
      `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m`+
      `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max`+
      `&timezone=Europe%2FZurich&forecast_days=2`;

    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();

    const [summary,icon]=weatherInfo(d.current.weather_code);
    document.getElementById('currentTemp').textContent=Math.round(d.current.temperature_2m)+'°';
    document.getElementById('currentSummary').textContent=summary;
    document.getElementById('currentIcon').textContent=icon;
    document.getElementById('currentExtra').textContent =
      `Gefühlt ${Math.round(d.current.apparent_temperature)}° · Wind ${Math.round(d.current.wind_speed_10m)} km/h`;

    const today = new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
    const now = new Date();

    const remainingToday = [];
    d.hourly.time.forEach((t,i)=>{
      const dt=new Date(t);
      const day=dt.toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
      if(day===today && dt >= now) remainingToday.push(i);
    });

    const futureRain = remainingToday.map(i => Number(d.hourly.precipitation_probability[i] ?? 0));
    const futureRainMm = remainingToday.reduce((sum,i) => sum + Number(d.hourly.precipitation[i] ?? 0), 0);
    const futureTemps = remainingToday.map(i => Number(d.hourly.temperature_2m[i])).filter(Number.isFinite);

    document.getElementById('maxRain').textContent =
      futureRain.length ? `${Math.round(Math.max(...futureRain))} %` : '–';
    document.getElementById('rainSum').textContent =
      remainingToday.length ? `${futureRainMm.toFixed(1)} mm` : '–';
    document.getElementById('tempRange').textContent =
      futureTemps.length ? `${Math.round(Math.min(...futureTemps))}° bis ${Math.round(Math.max(...futureTemps))}°` : '–';

    const timeline=document.getElementById('timeline');
    timeline.innerHTML='';

    const indexes=[];
    d.hourly.time.forEach((t,i)=>{
      const dt=new Date(t);
      const day=dt.toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'});
      const hour=dt.getHours();

      // Nur kommende Stunden des heutigen Tages.
      // Anzeige wieder im 2-Stunden-Raster.
      if(day===today && dt >= now && hour<=23 && hour%2===0){
        indexes.push(i);
      }
    });

    indexes.slice(0,4).forEach(i=>{
      const dt=new Date(d.hourly.time[i]);
      const [label,ico]=weatherInfo(d.hourly.weather_code[i]);
      const isNow=Math.abs(dt-now)<75*60*1000;
      const el=document.createElement('div');
      el.className='hour'+(isNow?' now':'');
      el.title=label;
      el.innerHTML=`
        <div class="hour-time">${dt.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div>
        <div class="hour-icon">${ico}</div>
        <div class="hour-temp">${Math.round(d.hourly.temperature_2m[i])}°</div>
        <div class="hour-rain">☔ ${Math.round(d.hourly.precipitation_probability[i] ?? 0)}%</div>
        <div class="hour-mm">${Number(d.hourly.precipitation[i] ?? 0).toFixed(1)} mm</div>
      `;
      timeline.appendChild(el);
    });

    status.textContent='Automatische Aktualisierung alle 10 Minuten.';
    status.classList.remove('error');
  }catch(e){
    document.getElementById('currentSummary').textContent='Wetter konnte nicht geladen werden.';
    status.textContent=e.message;
    status.classList.add('error');
  }
}

loadWeather();
setInterval(loadWeather,10*60*1000);
</script>
</body>
</html>
